services:

  database:
    image: postgres:16-alpine
    container_name: colegio-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: colegio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build: ./backend
    container_name: colegio-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@database:5432/colegio
      JWT_SECRET: change-this-in-production
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: colegio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

# Firebase:
# - Firestore Database
# - Firebase Authentication
# - Firebase Cloud Messaging

volumes:
  postgres-data: