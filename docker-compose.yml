services:

  backend:
    build: ./backend
    container_name: colegio-backend
    restart: unless-stopped
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: colegio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

