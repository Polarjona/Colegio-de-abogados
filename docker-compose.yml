services:

  postgres:
    image: postgres:16
    container_name: colegio-db
    environment:
      POSTGRES_DB: colegio
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: colegio-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: colegio-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
