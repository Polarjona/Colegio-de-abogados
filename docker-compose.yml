services:

  backend:
    build: ./backend
    container_name: colegio-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "${BACKEND_PORT:-3006}:8080"
    environment:
      PORT: 8080

  frontend:
    build: ./frontend
    container_name: colegio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

# Firebase services used:
# - Firebase Authentication
# - Cloud Firestore
# - Firebase Cloud Messaging
